name: Mirror source archives

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: Source bundle to publish
        required: true
        type: choice
        default: gdb
        options:
          - gdb
          - tcpdump
      immutable_releases_enabled:
        description: Confirm repository release immutability is enabled
        required: true
        type: boolean

permissions:
  contents: write

jobs:
  publish-gdb-source:
    if: ${{ inputs.recipe == 'gdb' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load and validate source lock
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source recipes/gdb/aarch64/source.lock
          expected_mirror="https://github.com/${GITHUB_REPOSITORY}/releases/download/${SOURCE_RELEASE_TAG}/${SOURCE_ARCHIVE}"
          test "${SOURCE_MIRROR_URL}" = "${expected_mirror}"
          test "${SOURCE_UPSTREAM_URL}" != "${SOURCE_MIRROR_URL}"
          test "${SOURCE_ARCHIVE}" = "gdb-${SOURCE_VERSION}.tar.xz"
          echo "version=${SOURCE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "archive=${SOURCE_ARCHIVE}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${SOURCE_SHA256}" >> "${GITHUB_OUTPUT}"
          echo "upstream_url=${SOURCE_UPSTREAM_URL}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${SOURCE_RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Refuse replacement
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.immutable_releases_enabled }}" = true
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "error: release already exists: ${RELEASE_TAG}" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "error: tag already exists: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Download and verify official source
        env:
          SOURCE_ARCHIVE: ${{ steps.source.outputs.archive }}
          SOURCE_SHA256: ${{ steps.source.outputs.sha256 }}
          SOURCE_UPSTREAM_URL: ${{ steps.source.outputs.upstream_url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mirror-assets
          curl --fail --location --retry 5 --retry-all-errors \
            --output "mirror-assets/${SOURCE_ARCHIVE}" "${SOURCE_UPSTREAM_URL}"
          echo "${SOURCE_SHA256}  mirror-assets/${SOURCE_ARCHIVE}" | sha256sum -c -
          cp recipes/gdb/aarch64/source.lock mirror-assets/source.lock
          tar -czf mirror-assets/gdb-distribution-materials.tar.gz \
            -C recipes/gdb/aarch64 source.lock licenses

      - name: Publish immutable source release once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
          SOURCE_ARCHIVE: ${{ steps.source.outputs.archive }}
          SOURCE_VERSION: ${{ steps.source.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --draft \
            --title "GDB ${SOURCE_VERSION} verified source" \
            --notes "Verified upstream source and distribution materials for the static AArch64 GDB recipe."
          gh release upload "${RELEASE_TAG}" mirror-assets/* \
            --repo "${GITHUB_REPOSITORY}"
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
          release_immutable="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              --jq .immutable || printf false
          )"
          if [ "${release_immutable}" != true ]; then
            gh release delete "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --cleanup-tag --yes
            echo "error: published release was not immutable; removed release and tag" >&2
            exit 1
          fi

  publish-tcpdump-source:
    if: ${{ inputs.recipe == 'tcpdump' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load and validate two-source lock
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source recipes/tcpdump/x86_64/source.lock
          : "${SOURCE_VERSION:?missing SOURCE_VERSION}"
          : "${SOURCE_ARCHIVE:?missing SOURCE_ARCHIVE}"
          : "${SOURCE_SHA256:?missing SOURCE_SHA256}"
          : "${SOURCE_UPSTREAM_URL:?missing SOURCE_UPSTREAM_URL}"
          : "${SOURCE_RELEASE_TAG:?missing SOURCE_RELEASE_TAG}"
          : "${SOURCE_MIRROR_URL:?missing SOURCE_MIRROR_URL}"
          : "${SOURCE_LICENSE:?missing SOURCE_LICENSE}"
          : "${LIBPCAP_VERSION:?missing LIBPCAP_VERSION}"
          : "${LIBPCAP_ARCHIVE:?missing LIBPCAP_ARCHIVE}"
          : "${LIBPCAP_SHA256:?missing LIBPCAP_SHA256}"
          : "${LIBPCAP_UPSTREAM_URL:?missing LIBPCAP_UPSTREAM_URL}"
          : "${LIBPCAP_MIRROR_URL:?missing LIBPCAP_MIRROR_URL}"
          : "${LIBPCAP_LICENSE:?missing LIBPCAP_LICENSE}"

          release_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${SOURCE_RELEASE_TAG}"
          test "${SOURCE_MIRROR_URL}" = "${release_base}/${SOURCE_ARCHIVE}"
          test "${LIBPCAP_MIRROR_URL}" = "${release_base}/${LIBPCAP_ARCHIVE}"
          test "${SOURCE_UPSTREAM_URL}" != "${SOURCE_MIRROR_URL}"
          test "${LIBPCAP_UPSTREAM_URL}" != "${LIBPCAP_MIRROR_URL}"
          [[ "${SOURCE_UPSTREAM_URL}" == https://* ]]
          [[ "${LIBPCAP_UPSTREAM_URL}" == https://* ]]
          [[ "${SOURCE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${LIBPCAP_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          test "${SOURCE_ARCHIVE}" = "tcpdump-${SOURCE_VERSION}.tar.gz"
          test "${LIBPCAP_ARCHIVE}" = "libpcap-${LIBPCAP_VERSION}.tar.gz"
          test "${SOURCE_ARCHIVE}" != "${LIBPCAP_ARCHIVE}"

          echo "version=${SOURCE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tcpdump_archive=${SOURCE_ARCHIVE}" >> "${GITHUB_OUTPUT}"
          echo "tcpdump_sha256=${SOURCE_SHA256}" >> "${GITHUB_OUTPUT}"
          echo "tcpdump_url=${SOURCE_UPSTREAM_URL}" >> "${GITHUB_OUTPUT}"
          echo "libpcap_version=${LIBPCAP_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "libpcap_archive=${LIBPCAP_ARCHIVE}" >> "${GITHUB_OUTPUT}"
          echo "libpcap_sha256=${LIBPCAP_SHA256}" >> "${GITHUB_OUTPUT}"
          echo "libpcap_url=${LIBPCAP_UPSTREAM_URL}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${SOURCE_RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Refuse replacement
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.immutable_releases_enabled }}" = true
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "error: release already exists: ${RELEASE_TAG}" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "error: tag already exists: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Download and verify official sources
        env:
          LIBPCAP_ARCHIVE: ${{ steps.source.outputs.libpcap_archive }}
          LIBPCAP_SHA256: ${{ steps.source.outputs.libpcap_sha256 }}
          LIBPCAP_URL: ${{ steps.source.outputs.libpcap_url }}
          TCPDUMP_ARCHIVE: ${{ steps.source.outputs.tcpdump_archive }}
          TCPDUMP_SHA256: ${{ steps.source.outputs.tcpdump_sha256 }}
          TCPDUMP_URL: ${{ steps.source.outputs.tcpdump_url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mirror-assets
          curl --fail --location --retry 5 --retry-all-errors \
            --output "mirror-assets/${TCPDUMP_ARCHIVE}" "${TCPDUMP_URL}"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "mirror-assets/${LIBPCAP_ARCHIVE}" "${LIBPCAP_URL}"
          echo "${TCPDUMP_SHA256}  mirror-assets/${TCPDUMP_ARCHIVE}" | sha256sum -c -
          echo "${LIBPCAP_SHA256}  mirror-assets/${LIBPCAP_ARCHIVE}" | sha256sum -c -
          cp recipes/tcpdump/x86_64/source.lock mirror-assets/source.lock
          tar -czf mirror-assets/tcpdump-distribution-materials.tar.gz \
            -C recipes/tcpdump/x86_64 source.lock licenses

      - name: Publish immutable two-source release once
        env:
          GH_TOKEN: ${{ github.token }}
          LIBPCAP_ARCHIVE: ${{ steps.source.outputs.libpcap_archive }}
          LIBPCAP_VERSION: ${{ steps.source.outputs.libpcap_version }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
          SOURCE_VERSION: ${{ steps.source.outputs.version }}
          TCPDUMP_ARCHIVE: ${{ steps.source.outputs.tcpdump_archive }}
        shell: bash
        run: |
          set -euo pipefail
          release_created=false
          cleanup_failed_release() {
            status=$?
            trap - EXIT
            if [[ "${status}" -ne 0 && "${release_created}" == true ]]; then
              gh release delete "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
                --cleanup-tag --yes || true
            fi
            exit "${status}"
          }
          trap cleanup_failed_release EXIT

          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --draft \
            --title "tcpdump ${SOURCE_VERSION} and libpcap ${LIBPCAP_VERSION} verified sources" \
            --notes "Verified upstream sources and distribution materials for the static x86-64 tcpdump recipe."
          release_created=true
          gh release upload "${RELEASE_TAG}" mirror-assets/* \
            --repo "${GITHUB_REPOSITORY}"

          expected_assets="$({
            printf '%s\n' \
              "${TCPDUMP_ARCHIVE}" \
              "${LIBPCAP_ARCHIVE}" \
              source.lock \
              tcpdump-distribution-materials.tar.gz
          } | sort)"
          actual_assets="$(gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets \
            --jq '.assets[].name' | sort)"
          if [[ "${actual_assets}" != "${expected_assets}" ]]; then
            echo "error: draft release assets do not match reviewed inputs" >&2
            diff -u <(printf '%s\n' "${expected_assets}") <(printf '%s\n' "${actual_assets}") >&2 || true
            exit 1
          fi

          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest=false
          for attempt in {1..12}; do
            if [[ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .immutable)" == true ]]; then
              trap - EXIT
              exit 0
            fi
            sleep 5
          done

          echo "error: published release was not immutable" >&2
          exit 1
