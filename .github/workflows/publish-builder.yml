name: Publish builder

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Builder architecture to publish
        required: true
        type: choice
        default: aarch64
        options:
          - aarch64
          - armv7
          - x86_64

permissions:
  contents: read
  packages: write

env:
  BUILDER_REPOSITORY: ghcr.io/w0ot-net/static_bins-builder

jobs:
  publish:
    runs-on: ${{ inputs.architecture == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select and load locked environment
        id: architecture
        shell: bash
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          set -euo pipefail

          case "${ARCHITECTURE}" in
            aarch64)
              directory=builders/aarch64
              expected_machine=aarch64
              builder_tag_prefix=aarch64
              platform=linux/arm64
              floating_tag=aarch64-latest
              cache_scope=aarch64-builder
              emulation=
              target_uname=
              ;;
            armv7)
              directory=builders/armv7
              expected_machine=aarch64
              builder_tag_prefix=armv7
              platform=linux/arm/v7
              floating_tag=armv7-latest
              cache_scope=armv7-builder
              emulation=arm
              target_uname=armv7l
              ;;
            x86_64)
              directory=builders/x86_64
              expected_machine=x86_64
              builder_tag_prefix=x64
              platform=linux/amd64
              floating_tag=x64-latest
              cache_scope=x86_64-builder
              emulation=
              target_uname=
              ;;
            *)
              echo "error: unsupported architecture ${ARCHITECTURE}" >&2
              exit 1
              ;;
          esac

          if [[ "$(uname -m)" != "${expected_machine}" ]]; then
            echo "error: ${ARCHITECTURE} builder must run on ${expected_machine}, found $(uname -m)" >&2
            exit 1
          fi

          source "${directory}/environment.lock"
          case "${ALPINE_IMAGE}" in
            *@sha256:*) ;;
            *) echo "error: ALPINE_IMAGE must be pinned by digest" >&2; exit 1 ;;
          esac
          case "${BUILDER_TAG}" in
            "${builder_tag_prefix}"-*) ;;
            *) echo "error: BUILDER_TAG does not match ${builder_tag_prefix}" >&2; exit 1 ;;
          esac
          binfmt_image=
          if [[ -n "${emulation}" ]]; then
            case "${BINFMT_IMAGE}" in
              *@sha256:*) binfmt_image=${BINFMT_IMAGE} ;;
              *) echo "error: BINFMT_IMAGE must be pinned by digest" >&2; exit 1 ;;
            esac
          fi

          echo "directory=${directory}" >> "${GITHUB_OUTPUT}"
          echo "platform=${platform}" >> "${GITHUB_OUTPUT}"
          echo "floating_tag=${floating_tag}" >> "${GITHUB_OUTPUT}"
          echo "cache_scope=${cache_scope}" >> "${GITHUB_OUTPUT}"
          echo "alpine_image=${ALPINE_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "builder_tag=${BUILDER_TAG}" >> "${GITHUB_OUTPUT}"
          echo "binfmt_image=${binfmt_image}" >> "${GITHUB_OUTPUT}"
          echo "emulation=${emulation}" >> "${GITHUB_OUTPUT}"
          echo "target_uname=${target_uname}" >> "${GITHUB_OUTPUT}"

      - name: Register target emulation
        if: steps.architecture.outputs.emulation != ''
        shell: bash
        env:
          ALPINE_IMAGE: ${{ steps.architecture.outputs.alpine_image }}
          BINFMT_IMAGE: ${{ steps.architecture.outputs.binfmt_image }}
          EMULATION: ${{ steps.architecture.outputs.emulation }}
          PLATFORM: ${{ steps.architecture.outputs.platform }}
          TARGET_UNAME: ${{ steps.architecture.outputs.target_uname }}
        run: |
          set -euo pipefail
          docker run --privileged --rm "${BINFMT_IMAGE}" --install "${EMULATION}"
          observed_uname=$(docker run --rm --platform "${PLATFORM}" "${ALPINE_IMAGE}" uname -m)
          if [[ "${observed_uname}" != "${TARGET_UNAME}" ]]; then
            echo "error: target runtime reported ${observed_uname}, expected ${TARGET_UNAME}" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to replace a versioned builder
        shell: bash
        env:
          VERSIONED_IMAGE: ${{ env.BUILDER_REPOSITORY }}:${{ steps.architecture.outputs.builder_tag }}
        run: |
          if docker manifest inspect "${VERSIONED_IMAGE}" >/dev/null 2>&1; then
            echo "error: ${VERSIONED_IMAGE} already exists" >&2
            exit 1
          fi

      - name: Build and publish reusable builder
        id: builder
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./${{ steps.architecture.outputs.directory }}
          file: ./${{ steps.architecture.outputs.directory }}/Dockerfile
          platforms: ${{ steps.architecture.outputs.platform }}
          build-args: |
            ALPINE_IMAGE=${{ steps.architecture.outputs.alpine_image }}
          push: true
          tags: |
            ${{ env.BUILDER_REPOSITORY }}:${{ steps.architecture.outputs.builder_tag }}
            ${{ env.BUILDER_REPOSITORY }}:${{ steps.architecture.outputs.floating_tag }}
          cache-from: type=gha,scope=${{ steps.architecture.outputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.architecture.outputs.cache_scope }}
          provenance: mode=max
          sbom: true

      - name: Report immutable digest
        shell: bash
        env:
          BUILDER_DIGEST: ${{ steps.builder.outputs.digest }}
          ENVIRONMENT_LOCK: ${{ steps.architecture.outputs.directory }}/environment.lock
        run: |
          echo "Update BUILDER_IMAGE in ${ENVIRONMENT_LOCK} to:" >> "${GITHUB_STEP_SUMMARY}"
          echo '```text' >> "${GITHUB_STEP_SUMMARY}"
          echo "${BUILDER_REPOSITORY}@${BUILDER_DIGEST}" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
