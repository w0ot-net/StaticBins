name: Publish builder

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  BUILDER_REPOSITORY: ghcr.io/w0ot-net/static_bins-builder

jobs:
  publish:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load locked environment
        id: environment
        shell: bash
        run: |
          set -euo pipefail
          source aarch64_alpine_build_scripts/environment.lock
          echo "alpine_image=${ALPINE_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "builder_tag=${BUILDER_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to replace a versioned builder
        shell: bash
        env:
          VERSIONED_IMAGE: ${{ env.BUILDER_REPOSITORY }}:${{ steps.environment.outputs.builder_tag }}
        run: |
          if docker manifest inspect "${VERSIONED_IMAGE}" >/dev/null 2>&1; then
            echo "error: ${VERSIONED_IMAGE} already exists" >&2
            exit 1
          fi

      - name: Build and publish reusable builder
        id: builder
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./aarch64_alpine_build_scripts
          file: ./aarch64_alpine_build_scripts/Dockerfile
          platforms: linux/arm64
          build-args: |
            ALPINE_IMAGE=${{ steps.environment.outputs.alpine_image }}
          push: true
          tags: |
            ${{ env.BUILDER_REPOSITORY }}:${{ steps.environment.outputs.builder_tag }}
            ${{ env.BUILDER_REPOSITORY }}:aarch64-latest
          cache-from: type=gha,scope=aarch64-builder
          cache-to: type=gha,mode=max,scope=aarch64-builder
          provenance: mode=max
          sbom: true

      - name: Report immutable digest
        shell: bash
        env:
          BUILDER_DIGEST: ${{ steps.builder.outputs.digest }}
        run: |
          echo "Update BUILDER_IMAGE in aarch64_alpine_build_scripts/environment.lock to:" >> "${GITHUB_STEP_SUMMARY}"
          echo '```text' >> "${GITHUB_STEP_SUMMARY}"
          echo "${BUILDER_REPOSITORY}@${BUILDER_DIGEST}" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
