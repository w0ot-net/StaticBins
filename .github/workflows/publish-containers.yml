name: Publish containers

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-containers.yml"
      - "recipes/catalog.tsv"
      - "scripts/recipes.py"
      - "builders/**"
      - "recipes/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  catalog:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.recipes.outputs.matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate recipes and emit matrix
        id: recipes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/recipes.py validate
          echo "matrix=$(python3 scripts/recipes.py matrix)" >> "${GITHUB_OUTPUT}"

  publish:
    needs: catalog
    name: ${{ matrix.name }} (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load locked environment
        id: environment
        shell: bash
        run: |
          set -euo pipefail
          source "${{ matrix.environment_lock }}"
          case "${BUILDER_IMAGE}" in
            *@sha256:*) ;;
            *) echo "error: BUILDER_IMAGE must be pinned by digest" >&2; exit 1 ;;
          esac
          echo "builder_image=${BUILDER_IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose registry tags
        id: registry
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
          TAG_SUFFIXES: ${{ matrix.tag_suffixes }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/${IMAGE_NAME}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          {
            echo 'tags<<EOF'
            while IFS= read -r tag_suffix; do
              printf '%s:%s\n' "${image}" "${tag_suffix}"
            done <<< "${TAG_SUFFIXES}"
            echo EOF
          } >> "${GITHUB_OUTPUT}"

      - name: Build and publish artifact
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILDER_IMAGE=${{ steps.environment.outputs.builder_image }}
            BUILD_JOBS=4
          push: true
          tags: ${{ steps.registry.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          provenance: mode=max
          sbom: true
